services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/downloads:/app/downloads
    env_file:
      - ./backend/.env.local
    environment:
      - PYTHONUNBUFFERED=1
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local

volumes:
  downloads:
